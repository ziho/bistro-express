# Include inside the existing share.zihoh.com HTTPS server block.
# Docker DNS resolves the application after container replacement.
location = /bistro {
  return 308 /bistro/;
}

location ^~ /bistro/admin {
  return 404;
}

location ^~ /bistro/api/admin {
  return 404;
}

location ^~ /bistro/ {
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $bistro_upstream http://bistro-express:3000;
  proxy_pass $bistro_upstream$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # Replace client-supplied forwarding headers at the trusted proxy boundary.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 65s;
  client_max_body_size 1m;
}
